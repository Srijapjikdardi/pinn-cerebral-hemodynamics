# Config for the 60-patient dataset (data/synthetic_demo.h5) and the
# gpinn_60patient_best.pt checkpoint (55.7% MAPE). Same structure as demo.yaml,
# just sweep.n_simulations=60 / n_validation_holdout=12 instead of 20/5 — this file
# didn't exist for most of this project's development (every 60-patient run used a
# throwaway temp config); added so the shipped checkpoint is actually reproducible
# without reverse-engineering the override values.
topology:
  n_segments: 11
  optional_segments:
  - ACoA
  - PCoA_L
  - PCoA_R
sweep:
  n_simulations: 60
  n_validation_holdout: 12
  stiffness_E_range_Pa:
  - 400000.0
  - 2000000.0
  missing_vessel_prob: 0.35
  cardiac_cycle_s: 0.8
  n_cycles_simulated: 1
  inlet_waveform: physiological_ICA
  spatial_points_per_segment: 6
  time_points_per_cycle: 50
  random_seed: 42
solver:
  type: local_fd
  dt_s: 0.0001
  blood_density_kg_m3: 1060.0
  blood_dynamic_viscosity_pa_s: 0.0035
  friction_coefficient: 22.0
  wall_thickness_ratio: 0.1
model:
  hidden_dim: 128
  n_hidden_layers: 6
  activation: sine
  siren_omega_0: 30.0
  graph_encoder_hidden_dim: 64
  graph_encoder_out_dim: 32
  output_scales:
    area_ratio_scale: 0.4
    area_ratio_min: 0.8
    velocity_scale_ms: 0.3
    flow_ratio_scale: 3.0
  wall_thickness_ratio: 0.1
loss_weights:
  data: 3.0
  mass: 1.0
  momentum: 1.0
  boundary: 1.0
  junction: 1.0
  self_adaptive: false
training:
  batch_size_collocation: 512
  batch_size_data: 128
  adam_epochs: 3000
  total_adam_epochs: 3000
  adam_lr: 0.001
  lbfgs_max_iter: 200
  lbfgs_history_size: 50
  checkpoint_every: 1000
  device: cpu
validation:
  mape_target_percent: 5.0
  cfd_reference_time_s: null
